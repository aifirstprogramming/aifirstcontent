name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Schema conformance, global id uniqueness, and a strict load. Id
      # uniqueness is the gate that protects learner progress logs.
      - name: Validate content
        run: bun scripts/validate.ts

      # Every authored example/step id must be present; a missing id would make
      # the exercise unaddressable and unrecordable.
      - name: Check all content has ids
        run: bun scripts/add-ids.ts --check

      - name: Test
        run: bun test

      - name: Typecheck (src, CommonJS for the VS Code extension)
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Typecheck (tests and scripts, ESM under Bun)
        run: bunx tsc -p tsconfig.test.json

      - name: Build
        run: bunx tsc -p tsconfig.json

      # Guards against books/ drifting from the ids the script would assign.
      - name: Content is unchanged by a re-run of add-ids
        run: |
          bun scripts/add-ids.ts
          git diff --exit-code books/ || {
            echo "::error::books/ changed when add-ids.ts re-ran; commit the result."
            exit 1
          }

  # Actually execute every exercise.
  #
  # `aifirst run` only records an exercise as complete when the program runs, so
  # an exercise that cannot run is one a learner can never finish. Checking the
  # text of the code would not catch that; running it does.
  run-exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 11+ can launch a single source file directly, which is how the CLI
          # runs Java exercises without a build tool.
          java-version: "21"

      - run: bun install --frozen-lockfile

      # Java test exercises execute through the JUnit console launcher rather than a
      # build tool, so the books need no pom.xml and CI needs no Maven.
      - name: Fetch the JUnit console launcher
        run: |
          mkdir -p ~/.aifirst-toolcache
          curl -sSLo ~/.aifirst-toolcache/junit-console.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Run every exercise
        run: bun scripts/run-exercises.ts
