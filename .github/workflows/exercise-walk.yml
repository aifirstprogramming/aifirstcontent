name: Full exercise walk

on:
  workflow_call:

jobs:
  exercise-walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: bun install --frozen-lockfile

      - name: Install verification runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y maven
          mkdir -p ~/.aifirst-toolcache
          curl -sSLo ~/.aifirst-toolcache/junit-console.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Run isolated and sequential exercise checks
        run: bun scripts/run-exercises.ts --isolated --sequential --report test-results/book-walk/report.json

      - name: Upload exercise walk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-book-walk-report
          path: test-results/book-walk/report.json
          if-no-files-found: error
          retention-days: 14
